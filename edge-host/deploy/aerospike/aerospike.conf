# Hokeka Edge — Aerospike (Community Edition) single-node feature store.
#
# Isolation: this node is reachable ONLY by the edge app. In the container deployment that is
# enforced by the private Docker network with no published port (see docker-compose.yml). For a
# native install, bind `service.address` to 127.0.0.1 and firewall port 3000 (install.sh --native
# does this). For Aerospike ENTERPRISE, additionally enable the `security { enable-security true }`
# stanza and TLS for defence-in-depth (DB-level auth); CE relies on network isolation.

service {
    proto-fd-max 15000
    # run as the aerospike user inside the container image
}

logging {
    console {
        context any info
    }
}

network {
    service {
        address any        # container: any (network-isolated). Native: set to 127.0.0.1
        port 3000
    }
    heartbeat {
        mode mesh          # single node — no mesh-seed peers configured
        port 3002
        interval 150
        timeout 10
    }
    fabric {
        port 3001
    }
    info {
        port 3003
    }
}

namespace hokeka {
    replication-factor 1
    default-ttl 30d        # velocity/profile features expire → the store stays bounded

    storage-engine device {
        file /opt/aerospike/data/hokeka.dat
        filesize 16G       # raise per the sizing tier in the install guide
        data-in-memory false
    }
}
