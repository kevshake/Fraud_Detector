server:
  port: 8091

spring:
  application:
    name: hokeka-aml-microservice

aerospike:
  host: ${AEROSPIKE_HOST:fd-test-aerospike}
  port: ${AEROSPIKE_PORT:3000}

aml:
  # Shared symmetric key required by InternalAuthFilter on /internal/**.
  # Empty => filter disabled (dev only). Production MUST set AML_MS_INTERNAL_KEY.
  internal-auth-key: ${AML_MS_INTERNAL_KEY:}

sanctions:
  match:
    similarity:
      # Lower bound for emitting a match. Status FLAGGED at >=0.95, REVIEW in [threshold, 0.95).
      threshold: ${SANCTIONS_SIMILARITY_THRESHOLD:0.8}

aml:
  risk:
    # Comma-separated ISO country codes at each risk tier.
    # Managed in DB for BACKEND; this configuration drives the microservice's
    # lightweight rule-based scoring. Empty values = no countries at that tier.
    high-risk-countries: ${AML_HIGH_RISK_COUNTRIES:IR,KP,SY,CU,SD}
    medium-risk-countries: ${AML_MEDIUM_RISK_COUNTRIES:NG,RU,CN,VE}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
